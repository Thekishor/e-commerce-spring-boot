<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verification</title>
</head>
<body style="margin:0; background:#f5f6f8;">
<div style="max-width:500px;margin:40px auto;padding:30px;font-family:Arial,sans-serif;color:#222;background:#fff;border:1px solid #e8e8e8;border-radius:8px;">

    <!-- Title -->
    <h2 style="margin:0 0 18px; font-size:24px;font-weight:600;text-align:center;color:#111827;">
        Verify Your Email
    </h2>

    <!-- Message -->
    <p style="margin:0;font-size:15px;line-height:1.4;color:#555;">
        Thanks for creating your account! Please verify your email address
        to complete your registration.
    </p>

    <!-- Button -->
    <div style="text-align:center;margin:28px 0;">
        <a
                th:href="${verificationLink}"
                target="_blank"
                style="
                display:inline-block;
                background-color:#111827;
                color:#ffffff;
                padding:12px 24px;
                text-decoration:none;
                border-radius:7px;
                font-size:15px;
                font-weight:600;
            ">
            Verify Email
        </a>
    </div>

    <!-- Expiration -->
    <p style="margin:0 0 14px;font-size:13px;line-height:1.5;color:#777;">
        This verification link will expire in
        <strong>24 hours</strong>.
    </p>

    <!-- Security message -->
    <p style="margin:0;font-size:13px;line-height:1.5;color:#777;">
        If you didn't create this account, you can safely ignore this email.
    </p>

    <!-- Divider -->
    <hr style="border:none;border-top:1px solid #eeeeee;margin:28px 0;">

    <!-- Footer -->
    <p style="margin:0;text-align:center;font-size:12px;line-height:1.5;color:#999;">
        This is an automated email. Please do not reply.
    </p>
</div>
</body>
</html>
